services:
  postgres:
    image: postgres:16-alpine
    container_name: lugie_prod_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lugie}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lugie_prod_password}
      POSTGRES_DB: ${POSTGRES_DB:-lugie}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lugie} -d ${POSTGRES_DB:-lugie}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lugie_network

  redis:
    image: redis:7.2-alpine
    container_name: lugie_prod_redis
    restart: always
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lugie_network

  minio:
    image: minio/minio:latest
    container_name: lugie_prod_minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-lugie_minio_admin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-lugie_minio_secret_password}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - lugie_network

  minio-init:
    image: minio/mc:latest
    container_name: lugie_prod_minio_init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD};
      mc mb --ignore-existing local/$${BUCKET_NAME};
      mc mb --ignore-existing local/$${QUARANTINE_BUCKET};
      mc anonymous set none local/$${BUCKET_NAME};
      mc anonymous set none local/$${QUARANTINE_BUCKET};
      echo 'MinIO buckets initialized.';
      "
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-lugie_minio_admin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-lugie_minio_secret_password}
      BUCKET_NAME: ${S3_BUCKET_NAME:-lugie-documents}
      QUARANTINE_BUCKET: ${S3_QUARANTINE_BUCKET:-lugie-quarantine}
    networks:
      - lugie_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lugie_prod_backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-lugie}:${POSTGRES_PASSWORD:-lugie_prod_password}@postgres:5432/${POSTGRES_DB:-lugie}
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 1440
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-lugie_minio_admin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-lugie_minio_secret_password}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-lugie-documents}
      S3_QUARANTINE_BUCKET: ${S3_QUARANTINE_BUCKET:-lugie-quarantine}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,https://lugie.com}
      # Payment Gateway Keys (Optional - Sandbox Mode active by default)
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      STRIPE_API_KEY: ${STRIPE_API_KEY:-}
    ports:
      - "8000:8000"
    networks:
      - lugie_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: lugie_prod_frontend
    restart: always
    depends_on:
      - backend
    environment:
      NODE_ENV: production
      PORT: 3000
      BACKEND_INTERNAL_URL: http://backend:8000
      NEXT_PUBLIC_API_URL: /api/proxy
    ports:
      - "3000:3000"
    networks:
      - lugie_network

volumes:
  postgres_data:
  redis_data:
  minio_data:

networks:
  lugie_network:
    driver: bridge
